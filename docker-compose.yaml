services:
  train:
    build: .
    image: gcnn:latest
    container_name: gcnn-train
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.train"]

  train-experiment:
    build: .
    image: gcnn:latest
    container_name: gcnn-train-experiment
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.train_experiment"]

  eval:
    build: .
    image: gcnn:latest
    container_name: gcnn-eval
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.evaluate"]

  tensorboard:
    build: .
    image: gcnn:latest
    container_name: gcnn-tensorboard
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "6067:6006"
    command: ["tensorboard", "--logdir", "outputs", "--host", "0.0.0.0"]

  optuna-dashboard:
    build: .
    image: gcnn:latest
    container_name: gcnn-optuna-dashboard
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8067:8080"
    command: ["optuna-dashboard", "sqlite:///study.db", "--host", "0.0.0.0", "--port", "8080"]

  bash:
    build: .
    image: gcnn:latest
    container_name: gcnn-bash
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    command: ["bash"]
