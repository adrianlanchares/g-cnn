services:
  chess-gecnn:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
    working_dir: /app
    command: ["bash"]