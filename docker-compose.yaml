services:
  chess-gecnn:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    ports:
      - "8067:8000"
      - "6067:6006"
    working_dir: /app
    command: ["python", "-m", "src.optuna", "--study-name", "chess-basecnn-1"]