services:
  train:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn-train
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.train"]

  train-basecnn:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn-train-basecnn
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.optuna", "--study-name", "chess-basecnn-1"]


  train-gecnn:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn-train-gecnn
    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "src.optuna", "--study-name", "chess-gecnn"]

  tensorboard:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn-tensorboard
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "6067:6006"
    command: ["tensorboard", "--logdir", "outputs", "--host", "0.0.0.0"]

  optuna-dashboard:
    build: .
    image: chess-gecnn:latest
    container_name: chess-gecnn-optuna-dashboard
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8067:8080"
    command: ["optuna-dashboard", "sqlite:///study.db", "--host", "0.0.0.0", "--port", "8080"]